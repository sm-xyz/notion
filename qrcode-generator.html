<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator Gratis & Cepat</title>
    <!-- Memanggil library QR Code berbasis Client-Side (CDN resmi yang stabil) -->
    <script src="https://cloudflare.com"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .wrapper {
            background: #ffffff;
            max-width: 450px;
            width: 100%;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
        }
        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 8px;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .input-box {
            width: 100%;
            padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
            margin-bottom: 20px;
        }
        .input-box:focus {
            border-color: #4f46e5;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover {
            background-color: #4338ca;
        }
        .qr-area {
            margin-top: 30px;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.4s ease;
        }
        #qrcode {
            padding: 15px;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            display: inline-block;
        }
        #qrcode img {
            margin: 0 auto;
        }
        .download-btn {
            margin-top: 20px;
            background-color: #10b981;
        }
        .download-btn:hover {
            background-color: #059669;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <h1>QR Code Generator</h1>
    <p>Masukkan tautan atau teks untuk membuat QR Code instan.</p>
    
    <input type="text" id="text-input" class="input-box" placeholder="Contoh: https://google.com atau teks biasa" autocomplete="off">
    <button id="generate-btn" class="btn">Buat QR Code</button>

    <div id="qr-area" class="qr-area">
        <div id="qrcode"></div>
        <button id="download-btn" class="btn download-btn">Unduh Gambar (PNG)</button>
    </div>
</div>

<script>
    const textInput = document.getElementById('text-input');
    const generateBtn = document.getElementById('generate-btn');
    const qrArea = document.getElementById('qr-area');
    const qrContainer = document.getElementById('qrcode');
    const downloadBtn = document.getElementById('download-btn');

    // Inisialisasi objek QRCode dari library
    let qrcodeInstance = null;

    generateBtn.addEventListener('click', () => {
        const textValue = textInput.value.trim();

        if (!textValue) {
            alert('Silakan masukkan teks atau link terlebih dahulu!');
            return;
        }

        // Hapus QR Code lama jika ada sebelum membuat yang baru
        qrContainer.innerHTML = '';
        qrArea.style.display = 'flex';

        // Membuat QR Code baru di dalam div #qrcode
        qrcodeInstance = new QRCode(qrContainer, {
            text: textValue,
            width: 250,
            height: 250,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H // Level koreksi error tinggi agar QR mudah dipindai
        });
    });

    // Fitur Unduh Gambar PNG langsung dari Browser
    downloadBtn.addEventListener('click', () => {
        // Mengambil elemen gambar yang digenerate otomatis oleh library qrcode.js
        const qrImage = qrContainer.querySelector('img');
        
        if (qrImage) {
            const imageSrc = qrImage.src;
            const downloadLink = document.createElement('a');
            downloadLink.href = imageSrc;
            downloadLink.download = 'qrcode-' + Date.now() + '.png'; // Nama file unduhan otomatis
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        } else {
            alert('Gagal mengunduh gambar. Silakan coba klik tombol "Buat QR Code" kembali.');
        }
    });

    // Menjalankan fungsi 'Buat' saat pengguna menekan tombol Enter pada keyboard
    textInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            generateBtn.click();
        }
    });
</script>

</body>
</html>
